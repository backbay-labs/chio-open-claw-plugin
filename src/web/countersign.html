<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenClaw · countersign</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 520px; margin: 3rem auto; padding: 0 1rem; color: #111; }
    h1 { font-size: 1.4rem; margin-bottom: .2rem; }
    .meta { color: #666; font-size: .85rem; margin-bottom: 1.5rem; }
    button { background: #e86a3a; color: white; border: 0; font-size: 1rem; padding: .75rem 1.25rem; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    pre { background: #f4f4f4; padding: .75rem; border-radius: 6px; font-size: .8rem; white-space: pre-wrap; word-break: break-all; }
    .ok { color: #1a7f37; }
    .err { color: #b3261e; }
    .action { text-transform: capitalize; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Countersign proposal</h1>
  <p class="meta">
    <span class="action">__ACTION__</span> on proposal
    <code>__PROPOSAL__</code>
    as <code>__PLATFORM__:__USER__</code>
  </p>
  <p>Tap the button and present your registered passkey. OpenClaw verifies the assertion against the public key you registered; the signature is forwarded to the trust plane as the countersignature on record.</p>
  <button id="go">Use passkey</button>
  <p id="status"></p>
  <pre id="result" hidden></pre>

  <script>
    // Minimal base64url helpers. WebAuthn responses are base64url-encoded.
    const b64urlToBuffer = (v) => {
      const s = v.replace(/-/g, '+').replace(/_/g, '/');
      const pad = s.length % 4 === 0 ? '' : '='.repeat(4 - (s.length % 4));
      const bin = atob(s + pad);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out.buffer;
    };
    const bufToB64url = (buf) => {
      const bytes = new Uint8Array(buf);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };

    const TOKEN = "__TOKEN__";
    const ACTION = "__ACTION__";
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const btn = document.getElementById("go");

    async function run() {
      btn.disabled = true;
      statusEl.textContent = "requesting challenge…";
      const chRes = await fetch("/countersign/challenge", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: TOKEN }),
      });
      if (!chRes.ok) {
        statusEl.textContent = "challenge failed";
        statusEl.className = "err";
        btn.disabled = false;
        return;
      }
      const options = await chRes.json();

      // Convert server-supplied base64url fields to ArrayBuffers for the
      // WebAuthn API.
      const publicKey = {
        ...options,
        challenge: b64urlToBuffer(options.challenge),
        allowCredentials: (options.allowCredentials || []).map(c => ({
          ...c,
          id: b64urlToBuffer(c.id),
        })),
      };

      let assertion;
      try {
        statusEl.textContent = "present your passkey…";
        assertion = await navigator.credentials.get({ publicKey });
      } catch (err) {
        statusEl.textContent = "passkey cancelled or failed: " + err.message;
        statusEl.className = "err";
        btn.disabled = false;
        return;
      }

      const response = {
        id: assertion.id,
        rawId: bufToB64url(assertion.rawId),
        type: assertion.type,
        response: {
          authenticatorData: bufToB64url(assertion.response.authenticatorData),
          clientDataJSON: bufToB64url(assertion.response.clientDataJSON),
          signature: bufToB64url(assertion.response.signature),
          userHandle: assertion.response.userHandle
            ? bufToB64url(assertion.response.userHandle)
            : null,
        },
        clientExtensionResults: assertion.getClientExtensionResults
          ? assertion.getClientExtensionResults()
          : {},
        authenticatorAttachment: assertion.authenticatorAttachment,
      };

      statusEl.textContent = "verifying…";
      const verifyRes = await fetch("/countersign/verify", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          token: TOKEN,
          action: ACTION,
          userHandle: "__USER__",
          response,
        }),
      });
      const data = await verifyRes.json();
      if (verifyRes.ok) {
        statusEl.textContent = "signed — return to chat";
        statusEl.className = "ok";
      } else {
        statusEl.textContent = "rejected: " + (data.error || verifyRes.status);
        statusEl.className = "err";
        btn.disabled = false;
      }
      resultEl.hidden = false;
      resultEl.textContent = JSON.stringify(data, null, 2);
    }
    btn.addEventListener("click", run);
  </script>
</body>
</html>
